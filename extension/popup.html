<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outfit Finder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="row header">
    <h1 class="logo">Shop the <span>Look</span></h1>
    <button id="openSettings" class="ghost">Settings</button>
  </header>

  <section class="panel">
    <div class="row gap">
      <button id="captureBtn">Select Region On Page</button>
    </div>
    <p class="hint">Select any item on the page. We&apos;ll match it with shoppable look-alikes in seconds.</p>
  </section>

  <section class="panel">
    <div class="canvas-wrap">
      <canvas id="previewCanvas" width="360" height="220"></canvas>
      <div id="canvasEmpty" class="empty">No screenshot yet</div>
    </div>
    <div class="row">
      <label>Preview</label>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
