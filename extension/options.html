<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outfit Finder Settings</title>
  <style>
    :root {
      --cream: #faf8f5;
      --ink: #1a1714;
      --warm-gray: #8a847d;
      --border: #e8e4de;
      --accent: #c9a96e;
      --accent-light: #f5efe4;
      --card-bg: #ffffff;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 26px auto;
      max-width: 760px;
      background: var(--cream);
      color: var(--ink);
      padding: 0 18px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }
    h1 {
      margin: 0 0 18px;
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 40px;
      line-height: 1;
    }
    h1 span {
      color: var(--accent);
      font-style: italic;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--warm-gray);
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      margin-top: 16px;
      padding: 11px 16px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
    }
    button:hover { background: #2d2824; border-color: #2d2824; }
    .status { margin-top: 12px; font-size: 13px; color: var(--warm-gray); }
    .hint { margin-top: 20px; font-size: 13px; color: var(--warm-gray); line-height: 1.6; }
    code { background: var(--accent-light); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shop the <span>Look</span> Settings</h1>
    <label for="apiBase">Backend API Base URL</label>
    <input id="apiBase" placeholder="http://127.0.0.1:8000" />
    <label for="webAppBase">Web App URL</label>
    <input id="webAppBase" placeholder="http://127.0.0.1:5500/index.html" />
    <button id="saveBtn">Save</button>
    <div id="status" class="status"></div>

    <div class="hint">
      Use your deployed backend URL in production, for example:
      <code>https://your-backend.onrender.com</code>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
